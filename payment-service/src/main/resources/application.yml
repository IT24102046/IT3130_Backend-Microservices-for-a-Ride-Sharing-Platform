server:
  port: 8084

spring:
  application:
    name: fare-payment-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ridelink_payment}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html