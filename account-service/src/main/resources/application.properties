server.port=8081

spring.application.name=account-service

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ridelink_account}
spring.data.mongodb.auto-index-creation=true

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Custom JWT configuration for the account service
spring.jwt.secret=${JWT_SECRET:mySuperSecretKeyForRideLinkPlatform2026ChangeThisInProduction1234567890}
spring.jwt.expiration=${JWT_EXPIRATION:86400000}

logging.level.com.ridelink=DEBUG
logging.level.org.springframework.security=DEBUG

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always