# Application
spring.application.name=driver-service

# Server Configuration
server.port=8082

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/driver_db
spring.data.mongodb.database=driver_db

# Jackson
spring.jackson.default-property-inclusion=non_null

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.ridelink.driver=DEBUG

# JWT
jwt.secret=${JWT_SECRET:ridelink-super-secret-jwt-signing-key-dev-only-change-me-2026}